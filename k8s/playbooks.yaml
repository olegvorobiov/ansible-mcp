apiVersion: v1
kind: ConfigMap
metadata:
  name: ansible-playbooks
  namespace: liz-toolshed
data:
  # Smoke test — verifies the runner can SSH into every host in
  # downstream_workers and run a trivial module. Run with:
  #   kubectl -n liz-toolshed exec deploy/ansible-runner -- \
  #     ansible-playbook /playbooks/ping.yml
  ping.yml: |
    ---
    - name: Smoke test — reach every host in inventory
      hosts: all
      gather_facts: false
      tasks:
        - name: Ping
          ansible.builtin.ping:
