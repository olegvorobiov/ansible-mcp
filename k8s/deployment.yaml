apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner
  namespace: liz-toolshed
  labels:
    app: ansible-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ansible-runner
  template:
    metadata:
      labels:
        app: ansible-runner
    spec:
      containers:
        - name: ansible
          # Image must include `sshpass` for SSH password auth.
          # willhallonline/ansible images bundle it; swap if needed.
          image: willhallonline/ansible:2.16-debian-bookworm
          command: ["sleep", "infinity"]
          env:
            - name: ANSIBLE_SSH_USER
              valueFrom:
                secretKeyRef:
                  name: ansible-ssh-credentials
                  key: username
            - name: ANSIBLE_SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ansible-ssh-credentials
                  key: password
          volumeMounts:
            - name: ansible-config
              mountPath: /etc/ansible/ansible.cfg
              subPath: ansible.cfg
            - name: ansible-config
              mountPath: /etc/ansible/hosts
              subPath: hosts
            - name: ansible-config
              mountPath: /etc/ansible/group_vars/all.yml
              subPath: group_vars-all.yml
            - name: playbooks
              mountPath: /playbooks
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ansible-config
          configMap:
            name: ansible-config
        - name: playbooks
          configMap:
            name: ansible-playbooks
